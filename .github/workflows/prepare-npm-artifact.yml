name: Prepare reviewed npm artifacts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Isolate public registry configuration
        run: |
          : > "$RUNNER_TEMP/user.npmrc"
          : > "$RUNNER_TEMP/global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_REGISTRY=https://registry.npmjs.org" >> "$GITHUB_ENV"
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Isolate the published core and source packages
        run: |
          package_root="$RUNNER_TEMP/public-packages"
          mkdir -p "$package_root/packages"
          cp package.json pnpm-lock.yaml tsconfig.json README.md LICENSE LICENSE-PREVIOUS NOTICE "$package_root/"
          cp -R src test "$package_root/"
          cp -R packages/ihat-store-source "$package_root/packages/"
          printf '%s\n' 'packages:' '  - "."' '  - "packages/ihat-store-source"' 'linkWorkspacePackages: true' > "$package_root/pnpm-workspace.yaml"
          echo "PUBLIC_PACKAGE_ROOT=$package_root" >> "$GITHUB_ENV"
      - name: Validate the published pair independently of unpublished candidates
        working-directory: ${{ env.PUBLIC_PACKAGE_ROOT }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm -r --include-workspace-root test
          pnpm audit --audit-level=low
      - name: Pack exact source distributions without lifecycle hooks
        working-directory: ${{ env.PUBLIC_PACKAGE_ROOT }}
        run: |
          mkdir "$GITHUB_WORKSPACE/outgoing"
          npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing"
          (cd packages/ihat-store-source && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/outgoing")
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/outgoing/source-sha.txt"
          (cd "$GITHUB_WORKSPACE/outgoing" && sha256sum ./*.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-npm-packages
          path: outgoing/
          if-no-files-found: error
          retention-days: 3
