name: Product runtime verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  product-runtime:
    name: product-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false
      - name: Existing-runtime regressions and native V8 coverage
        run: |
          mkdir -p reports
          node --test --test-isolation=none --experimental-test-coverage \
            --test-coverage-include='src/**/*.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=reports/coverage.lcov test/*.test.mjs
      - name: Native GitHub coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-runtime-${{ github.sha }}-node24.11.0
          path: reports/
          if-no-files-found: error
          retention-days: 14
