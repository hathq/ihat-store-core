name: Product runtime verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  product-runtime:
    name: product-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Existing-runtime regressions and native V8 coverage
        run: |
          mkdir -p reports
          node --test --test-isolation=none --experimental-test-coverage \
            --test-coverage-include='src/**/*.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=reports/coverage.lcov test/*.test.mjs
      - name: Consolidated catalog source regressions
        working-directory: packages/ihat-store-source
        run: node --test test/source-regression.test.mjs
      - name: Native GitHub coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-runtime-${{ github.sha }}-node24.11.0
          path: reports/
          if-no-files-found: error
          retention-days: 14

  scene-acceptance:
    name: scene-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/ihat-store-tests exec playwright install --with-deps chromium
      - run: pnpm run typecheck
      - run: pnpm -r --include-workspace-root test
